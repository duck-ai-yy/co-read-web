<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Read · 试用引导</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3EC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #6b6b6b;
    --line: #ececec;
    --accent: #1a1a1a;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  /* ===== Hero ===== */
  .hero { text-align: center; padding-bottom: 56px; border-bottom: 1px solid var(--line); }
  .brand {
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }
  .lede {
    color: var(--ink-soft);
    font-size: 1.1rem;
    max-width: 420px;
    margin: 0 auto 32px;
  }

  /* ===== 主按钮 ===== */
  .cta {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 32px;
    border-radius: 999px;
    transition: filter 0.15s;
  }
  .cta:hover { filter: brightness(1.35); }

  /* ===== 段落标题 ===== */
  .section-label {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 64px 0 24px;
  }

  /* ===== 玩法卡片 ===== */
  .feature {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .feature figure { background: var(--bg); border-top: 1px solid var(--line); }
  .feature img { display: block; width: 100%; height: auto; }
  .feature .body { padding: 32px 22px 24px; }
  .feature h3 {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .feature h3 .num {
    flex: 0 0 auto;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .feature p { color: var(--ink-soft); font-size: 0.95rem; }
  .feature code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.86em;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink);
  }

  /* ===== 标签色点（玩法 1 的小注脚）===== */
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .tag-chip { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

  /* ===== 30 秒上手 ===== */
  .steps { list-style: none; counter-reset: step; }
  .steps li {
    counter-increment: step;
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .steps li:last-child { border-bottom: none; }
  .steps li::before {
    content: counter(step);
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .steps .step-text { padding-top: 1px; }
  .steps .step-text strong { font-weight: 600; }
  .steps .step-text span { color: var(--ink-soft); }

  /* ===== 隐私 ===== */
  .privacy {
    margin-top: 40px;
    font-size: 0.86rem;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .privacy strong { color: var(--ink); font-weight: 600; }

  /* ===== 底部 ===== */
  .foot {
    margin-top: 64px;
    padding-top: 48px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .foot .contact {
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .foot .copyright {
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  /* ===== 语言切换 ===== */
  .lang-switch {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    overflow: hidden;
    font-size: 0.8rem;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 5px 12px;
    cursor: pointer;
    font: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .lang-switch button.active {
    background: var(--accent);
    color: #fff;
  }

  @media (max-width: 480px) {
    .page { padding: 48px 18px 64px; }
    .brand { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="lang-switch">
  <button id="lang-zh" type="button">中文</button>
  <button id="lang-en" type="button">EN</button>
</div>

<div class="page">

  <!-- Hero -->
  <header class="hero">
    <div class="brand">Co-Read</div>
    <p class="lede" data-i18n="lede"></p>
    <a class="cta" href="https://co-read-web.onrender.com/" data-i18n="cta"></a>
  </header>

  <!-- 30 秒上手 -->
  <div class="section-label" data-i18n="quickstart"></div>
  <ol class="steps">
    <li><div class="step-text"><strong data-i18n="step1t"></strong><br><span data-i18n="step1d"></span></div></li>
    <li><div class="step-text"><strong data-i18n="step2t"></strong><br><span data-i18n="step2d"></span></div></li>
    <li><div class="step-text"><strong data-i18n="step3t"></strong><br><span data-i18n="step3d"></span></div></li>
    <li><div class="step-text"><strong data-i18n="step4t"></strong><br><span data-i18n="step4d"></span></div></li>
  </ol>

  <!-- 三个核心玩法 -->
  <div class="section-label" data-i18n="features"></div>

  <article class="feature">
    <div class="body">
      <h3><span class="num">1</span><span data-i18n="f1t"></span></h3>
      <p data-i18n="f1d"></p>
      <div class="tag-row">
        <span class="tag-chip"><span class="dot" style="background:#ff5e5e"></span><span data-i18n="tag1"></span></span>
        <span class="tag-chip"><span class="dot" style="background:#54d062"></span><span data-i18n="tag2"></span></span>
        <span class="tag-chip"><span class="dot" style="background:#4a90e2"></span><span data-i18n="tag3"></span></span>
        <span class="tag-chip"><span class="dot" style="background:#a972e8"></span><span data-i18n="tag4"></span></span>
        <span class="tag-chip"><span class="dot" style="background:#f5d042"></span><span data-i18n="tag5"></span></span>
      </div>
    </div>
    <figure>
      <img src="/guide-assets/theme1-palette.jpeg" data-i18n-alt="f1alt" alt="">
    </figure>
  </article>

  <article class="feature">
    <div class="body">
      <h3><span class="num">2</span><span data-i18n="f2t"></span></h3>
      <p><span data-i18n="f2d_a"></span><code>@AI</code><span data-i18n="f2d_b"></span></p>
    </div>
    <figure>
      <img src="/guide-assets/theme2-compose.jpeg" data-i18n-alt="f2alt" alt="">
    </figure>
  </article>

  <article class="feature">
    <div class="body">
      <h3><span class="num">3</span><span data-i18n="f3t"></span></h3>
      <p data-i18n="f3d"></p>
    </div>
    <figure>
      <img src="/guide-assets/theme3-panel.jpeg" data-i18n-alt="f3alt" alt="">
    </figure>
  </article>

  <!-- 隐私 -->
  <div class="privacy">
    <strong data-i18n="privacyt"></strong><span data-i18n="privacyd"></span>
  </div>

  <!-- 底部 -->
  <footer class="foot">
    <p class="copyright">© 2026 duck-ai-yy</p>
  </footer>

</div>

<script>
  const I18N = {
    zh: {
      title: "Co-Read · 试用引导",
      lede: "边读论文，边问 AI，把想法沉淀成结构化笔记。",
      cta: "开始试用 →",
      quickstart: "30 秒上手",
      step1t: "粘贴链接", step1d: "arXiv 链接 / 直接 PDF URL / 本地 PDF 都行。",
      step2t: "读、划线、提问", step2d: "选文字选颜色，写批注或 @AI 提问。",
      step3t: "右栏查看整理", step3d: "所有标注与讨论按标签汇总在右栏。",
      step4t: "导出笔记", step4d: "顶部「导出笔记」一键导出 Markdown。",
      features: "三个核心玩法",
      f1t: "划线 = 打标签",
      f1d: "选中论文里的一段文字，浮出一排彩色标签 —— 选一个，这段就被标记并归类。",
      f1alt: "选中论文文字后浮出的彩色标签色板",
      tag1: "看不懂", tag2: "已掌握", tag3: "重点", tag4: "质疑", tag5: "课题相关",
      f2t: "@AI 就地提问",
      f2d_a: "标记后弹出小框：直接打字 = 给自己记批注；打 ",
      f2d_b: " + 问题 = AI 围绕这段原文回答你。",
      f2alt: "标记后弹出的批注框，输入 @AI 即可提问",
      f3t: "一处管全部",
      f3d: "右栏汇总所有标注与讨论，点一条跳回原文；顶部一键导出 Markdown 笔记。",
      f3alt: "右栏汇总所有标注与讨论的列表",
      privacyt: "关于隐私：",
      privacyd: "你的笔记 / 高亮 / 批注只存在你自己的浏览器里，不上传、可随时导出。论文全文和提问会发给第三方大模型（AI 功能需要）。"
    },
    en: {
      title: "Co-Read · Getting Started",
      lede: "Read papers, ask the AI as you go, and turn ideas into structured notes.",
      cta: "Start trying it →",
      quickstart: "Up and running in 30 seconds",
      step1t: "Paste a link", step1d: "An arXiv link, a direct PDF URL, or a local PDF — all work.",
      step2t: "Read, highlight, ask", step2d: "Select text, pick a color, write a note or ask with @AI.",
      step3t: "Review in the right panel", step3d: "Every annotation and discussion is grouped by tag in the right panel.",
      step4t: "Export your notes", step4d: "Hit “Export Notes” at the top to export Markdown in one click.",
      features: "Three core features",
      f1t: "Highlight = tag",
      f1d: "Select a passage in the paper and a row of colored tags appears — pick one, and the passage is marked and categorized.",
      f1alt: "Colored tag palette that pops up after selecting text in the paper",
      tag1: "Don't get it", tag2: "Got it", tag3: "Key point", tag4: "Questionable", tag5: "Topic-related",
      f2t: "Ask @AI in place",
      f2d_a: "After tagging, a small box pops up: just type = a note for yourself; type ",
      f2d_b: " + a question = the AI answers it based on that passage.",
      f2alt: "Annotation box that pops up after tagging; type @AI to ask",
      f3t: "Everything in one place",
      f3d: "The right panel aggregates every annotation and discussion; click an entry to jump back to the source. Export Markdown notes in one click from the top.",
      f3alt: "The right panel listing all annotations and discussions",
      privacyt: "About privacy: ",
      privacyd: "Your notes / highlights / annotations live only in your own browser — never uploaded, exportable anytime. The full paper text and your questions are sent to a third-party large language model (required for the AI features)."
    }
  };

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.zh;
    document.documentElement.lang = lang === "en" ? "en" : "zh";
    document.title = dict.title;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v != null) el.textContent = v;
    });
    document.querySelectorAll("[data-i18n-alt]").forEach(el => {
      const v = dict[el.dataset.i18nAlt];
      if (v != null) el.alt = v;
    });
    document.getElementById("lang-zh").classList.toggle("active", lang !== "en");
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
  }

  function setLang(lang) {
    try { localStorage.setItem("coread_lang", lang); } catch (e) {}
    applyLang(lang);
  }

  let initial = "zh";
  try {
    const saved = localStorage.getItem("coread_lang");
    if (saved === "en" || saved === "zh") initial = saved;
  } catch (e) {}

  document.getElementById("lang-zh").addEventListener("click", () => setLang("zh"));
  document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
  applyLang(initial);
</script>

</body>
</html>
